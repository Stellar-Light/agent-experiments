name: refresh-momo-checkpoint
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && node scripts-checkpoint.mjs
      - run: |
          git config user.name "momo-checkpoint" && git config user.email "bot@users.noreply.github.com"
          git add web/public/checkpoint.json
          git diff --cached --quiet || git commit -m "checkpoint: refresh Momo state (auto)" && git push
